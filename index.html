  <button id="theme-toggle">Toggle Magic Theme</button>

</body>

    <button id="theme-toggle">Toggle Magic Theme</button>
    
    <!-- Your content goes here -->
   <div class="grid-container">
    <article class="book-card">
        <img src="YOUR_BOOK_COVER_IMAGE_URL" alt="Book Title">
        <h3 class="book-title">Name of Book</h3>
        <p class="book-author">Author Name</p>
    </article>
</div>

        <ul id="music-list">
    <li class="track-item">
        <img class="track-art" src="YOUR_ALBUM_ART_URL" alt="Album Art">
        <div class="track-info">
            <span class="track-title">Song Name</span>
            <span class="track-artist">Artist Name</span>
        </div>
        <span class="track-duration">3:45</span>
    </li>
</ul>

    <script>

    // Check if the user previously chose the magic theme
    if (localStorage.getItem('site-theme') === 'theme-magic') {
        document.body.classList.add('theme-magic');
    }

    // Toggle the theme when the button is clicked
    toggleButton.addEventListener('click', () => {
        document.body.classList.toggle('theme-magic');
        
        // Save the current state
        if (document.body.classList.contains('theme-magic')) {
            localStorage.setItem('site-theme', 'theme-magic');
        } else {
            localStorage.setItem('site-theme', 'default');
        }
    });
</script>

</body>
